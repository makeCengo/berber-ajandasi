
name: Berber Ajandasi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.BERBER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/berber-ajandasi.jks

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BERBER_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Berber-Ajandasi-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
